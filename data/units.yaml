# K12 数学单元与先修关系。
# 来源：作者整理的 K12 数学学习路径（v0.2）的单元表；回访加深边取自其中的单元依赖图。
# 字段：
#   id / name / stage / domain：编号、单元名、学段、领域或主线
#   hard：硬先修（不掌握就学不下去）；补先修只沿这些边往回推
#   hard_any：二选一的硬先修组，学过其中任意一个即可（如 S5 的"H7 / J14"）
#   soft：软先修 / 表征复用，只作提示
#   fit：做视觉洞察视频的适配度（high ★ / low ☆ / none）
#   note：表格里写在括号中的说明
# 学段：primary-low 1–2 年级 | primary-mid 3–4 年级 | primary-high 5–6 年级 | junior 7–9 年级 | senior 高中 | extension 拓展
# 注意：各单元落在哪个年级因教材版本而异，H5 的学段归属待核实。
# 许可：CC BY 4.0，Boxi Yu。
version: 1

